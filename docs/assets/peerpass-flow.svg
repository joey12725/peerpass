<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOwner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="18" fill="#f8fafc"/>

  <!-- Owner -->
  <rect x="300" y="22" width="360" height="62" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">Owner</text>
  <text x="480" y="69" text-anchor="middle" font-size="12.5" fill="#92400e">peerpass issue · /pass in Discord, Slack, Telegram</text>
  <line x1="480" y1="84" x2="480" y2="124" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOwner)"/>
  <text x="490" y="109" font-size="11.5" fill="#92400e">issue · revoke · release</text>

  <!-- Visitors -->
  <text x="110" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.5">VISITING AGENTS</text>
  <g font-size="13" fill="#0f172a">
    <rect x="22" y="136" width="176" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="110" y="161" text-anchor="middle">A2A client</text>
    <rect x="22" y="184" width="176" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="110" y="209" text-anchor="middle">MCP / coding agent</text>
    <rect x="22" y="232" width="176" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="110" y="257" text-anchor="middle">HTTP + peerpass-client</text>
    <rect x="22" y="280" width="176" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="110" y="305" text-anchor="middle">Discord · Slack bots</text>
    <rect x="22" y="328" width="176" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="110" y="353" text-anchor="middle">Telegram · Matrix</text>
  </g>
  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M198,156 C250,156 260,250 318,250"/>
    <path d="M198,204 C250,204 262,250 318,250"/>
    <path d="M198,252 L318,252"/>
    <path d="M198,300 C250,300 262,254 318,254"/>
    <path d="M198,348 C250,348 260,256 318,256"/>
  </g>
  <text x="110" y="396" text-anchor="middle" font-size="11.5" fill="#475569">present the pass as a bearer token,</text>
  <text x="110" y="412" text-anchor="middle" font-size="11.5" fill="#475569">or chat from a redeemed identity</text>

  <!-- Gateway -->
  <rect x="320" y="128" width="320" height="300" rx="16" fill="url(#gate)"/>
  <text x="480" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">PeerPass gateway</text>
  <g font-size="13" fill="#dbeafe">
    <circle cx="350" cy="190" r="4" fill="#93c5fd"/><text x="364" y="194">pass hash lookup · expiry · revocation</text>
    <circle cx="350" cy="218" r="4" fill="#93c5fd"/><text x="364" y="222">scopes from the profile, never the caller</text>
    <circle cx="350" cy="246" r="4" fill="#93c5fd"/><text x="364" y="250">budget · rate limit · concurrency</text>
    <circle cx="350" cy="274" r="4" fill="#93c5fd"/><text x="364" y="278">server-written framing + tool allowlist</text>
    <circle cx="350" cy="302" r="4" fill="#93c5fd"/><text x="364" y="306">reviewed mode: reason, then review</text>
    <circle cx="350" cy="330" r="4" fill="#93c5fd"/><text x="364" y="334">hold for owner when unsure</text>
    <circle cx="350" cy="358" r="4" fill="#93c5fd"/><text x="364" y="362">metadata-only audit log</text>
  </g>
  <rect x="344" y="380" width="272" height="30" rx="8" fill="#1e3a8a" stroke="#60a5fa"/>
  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#bfdbfe">SQLite · hashes only · bounded retention</text>

  <!-- Host -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <path d="M640,252 L736,252" marker-end="url(#arrow)"/>
    <path d="M736,282 L640,282" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  </g>
  <text x="688" y="243" text-anchor="middle" font-size="11.5" fill="#475569">one call</text>
  <text x="688" y="300" text-anchor="middle" font-size="11.5" fill="#475569">reply</text>
  <rect x="738" y="168" width="200" height="200" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="838" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Your agent</text>
  <g font-size="12.5" fill="#065f46">
    <text x="838" y="232" text-anchor="middle">OpenAI-compatible API</text>
    <text x="838" y="258" text-anchor="middle">signed webhook</text>
    <text x="838" y="284" text-anchor="middle">MCP server (stdio)</text>
    <text x="838" y="310" text-anchor="middle">Python callable</text>
  </g>
  <text x="838" y="346" text-anchor="middle" font-size="11.5" fill="#047857">never sees the pass</text>
</svg>
